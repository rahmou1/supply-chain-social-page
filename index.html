<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#102a43">
<title>Supply Chain Department | روابطنا</title>
<style>
:root{--navy:#102a43;--blue:#1877f2;--muted:#64748b;--bg:#f4f7fb}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,"Tahoma",sans-serif;background:linear-gradient(145deg,#eef4fb,#f9fbff);color:var(--navy);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.wrap{width:100%;max-width:470px}
.card{background:#fff;border:1px solid #e5edf5;border-radius:28px;padding:30px 24px;box-shadow:0 18px 55px rgba(16,42,67,.10);text-align:center}
.logo{width:76px;height:76px;margin:0 auto 16px;border-radius:22px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:23px;letter-spacing:1px}
h1{font-size:25px;margin:0 0 9px;line-height:1.4}
.subtitle{color:var(--muted);font-size:15px;line-height:1.8;margin:0 0 24px}
.links{display:grid;gap:12px}
.link{display:flex;align-items:center;gap:13px;text-decoration:none;color:#fff;padding:15px 17px;border-radius:15px;font-size:16px;font-weight:700;transition:transform .15s,opacity .15s}
.link:hover{transform:translateY(-2px);opacity:.94}
.icon{width:35px;height:35px;border-radius:11px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0}
.label{flex:1;text-align:right}
.arrow{font-size:21px;opacity:.85}
.whatsapp{background:#25D366}.instagram{background:linear-gradient(120deg,#833ab4,#e1306c,#f77737)}.tiktok{background:#111}.facebook{background:#1877f2}.linkedin{background:#0A66C2}
.footer{color:#94a3b8;font-size:12px;margin-top:22px}
@media(max-width:380px){.card{padding:24px 17px}h1{font-size:22px}.link{padding:13px}}
</style>
</head>
<body>
<main class="wrap">
  <section class="card">
    <div class="logo" aria-hidden="true">SC</div>
    <h1>Supply Chain Department</h1>
    <p class="subtitle">تابعنا وانضم لمجتمعنا<br>اختار المنصة اللي تناسبك</p>
    <nav class="links" aria-label="روابط التواصل الاجتماعي">
      <a class="link whatsapp" href="https://chat.whatsapp.com/CfDUzN1R5XJLyLxhuzBdVZ?s=cl&amp;p=a&amp;mlu=4&amp;ilr=4" target="_blank" rel="noopener noreferrer">
        <span class="icon">✆</span><span class="label">جروب WhatsApp</span><span class="arrow">←</span>
      </a>
      <a class="link instagram" href="https://www.instagram.com/supply_chain_department_/" target="_blank" rel="noopener noreferrer">
        <span class="icon">◎</span><span class="label">Instagram</span><span class="arrow">←</span>
      </a>
      <a class="link tiktok" href="https://www.tiktok.com/@supply_chain_dep" target="_blank" rel="noopener noreferrer">
        <span class="icon">♪</span><span class="label">TikTok</span><span class="arrow">←</span>
      </a>
      <a class="link facebook" href="https://www.facebook.com/share/1EcpfTNQwD/" target="_blank" rel="noopener noreferrer">
        <span class="icon">f</span><span class="label">جروب Facebook</span><span class="arrow">←</span>
      </a>
      <a class="link linkedin" href="https://www.linkedin.com/company/supply-chain-management-department/" target="_blank" rel="noopener noreferrer">
  <span class="icon">in</span>
  <span class="label">LinkedIn</span>
  <span class="arrow">←</span>
</a>
    </nav>
    <div class="footer">كل روابطنا في مكان واحد • Supply Chain Department</div>
  </section>
</main>
</body>
</html>
